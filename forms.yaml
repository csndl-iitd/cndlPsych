forms:
  - id: "participant"
    type: "survey-text"
    data:
      phase: "setup"
    questions:
      - prompt: "Participant ID:"
        name: "participant_id"
        required: true
      - prompt: "Age:"
        name: "age"
        type: "text"
        required: false
      - prompt: "Gender:"
        name: "gender"
        type: "multi-choice"
        options:
          - "Male"
          - "Female"
        required: false

  - id: "session"
    type: "survey-text"
    data:
      phase: "setup"
    questions:
      - prompt: "Session Number:"
        name: "session_number"
        required: true
      - prompt: "Session Type:"
        name: "session_type"
        type: "dropdown"
        options:
          - "Control"
          - "Experimental"
        required: false