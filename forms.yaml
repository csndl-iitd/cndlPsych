forms:
  - id: "participant"
    type: "survey-text"
    data:
      phase: "setup"
    questions:
      - prompt: "Participant ID:"
        name: "participant_id"
        required: true
      - prompt: "Age:"
        name: "age"
        type: "text"
        required: true
      - prompt: "Gender:"
        name: "gender"
        type: "multi-choice"
        options:
          - "Male"
          - "Female"
        required: false
      - prompt: "Preferred Devices:"
        name: "devices"
        type: "multi-select"
        options:
          - "Keyboard"
          - "Mouse"
          - "Gamepad"
        required: false
      - prompt: "Language:"
        name: "language"
        type: "dropdown"
        options:
          - "English"
          - "Hindi"
          - "Spanish"
        required: true

  - id: "session"
    type: "survey-text"
    data:
      phase: "setup"
    questions:
      - prompt: "Session Number:"
        name: "session_number"
        required: true
      - prompt: "Session Type:"
        name: "session_type"
        type: "dropdown"
        options:
          - "Control"
          - "Experimental"
        required: true

  - id: "psychometric"
    type: "survey-multi-choice"
    data:
      phase: "psychometric"
    questions:
      - prompt: "How are you feeling today?"
        name: "feeling"
        type: "likert"
        options:
          - "Very Bad"
          - "Bad"
          - "Neutral"
          - "Good"
          - "Very Good"
        required: true
      - prompt: "How are you thinking today?"
        name: "thinking"
        type: "likert"
        options:
          - "Very Bad"
          - "Bad"
          - "Neutral"
          - "Good"
          - "Very Good"
        required: true
      - prompt: "How are you willing today?"
        name: "willing"
        type: "likert"
        options:
          - "Very Bad"
          - "Bad"
          - "Neutral"
          - "Good"
          - "Very Good"
        required: false
