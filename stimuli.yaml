stimuli:

  - name: "oddball_instructions"
    stimulus: |
      <div class="glass-panel" style="max-width: 600px; margin: 0 auto; padding: 35px; text-align: center; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; color: #f8fafc; font-family: 'Inter', sans-serif; line-height: 1.6; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);">
          <h2 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Oddball Task</h2>
          <p style="margin-bottom: 1.5rem; font-size: 1rem; color: #cbd5e1;">
              In this block, you will see a series of letters flashing at the center of the screen.
          </p>
          <p style="margin-bottom: 2rem; font-size: 1rem; color: #cbd5e1;">
              Press the space bar when you see the letter <span style="font-weight: 700;">Ǝ</span> for the <span style="font-weight: 700;">second</span> time. Try to respond as quickly as possible.
          </p>
          <div style="font-size: 0.95rem; color: #94a3b8; animation: pulse 2s infinite;">
              Press any key to begin.
          </div>
      </div>
    duration: null
    trigger: 9
    
  - name: "fixation_plus"
    stimulus: '<div style="font-size:72px;">+</div>'
    duration: 1500
    trigger: 1
    post: [200, 500]
    
  - name: "end_marker"
    stimulus: '<div style="font-size:72px;">XXX</div>'
    duration: 500
    trigger: 9
    post: [200, 500]

  - name: "oddball_A"
    stimulus: '<div style="font-size:72px; color:#ffffff; font-family: Inter, sans-serif; font-weight:bold;">A</div>'
    duration: 200
    trigger: 100
    post: 300

  - name: "oddball_B"
