# What is shown. Documented in docs/yaml/stimuli.md.
styles:
  panel:
    max-width: 600px
    margin: 0 auto
    padding: 30px
    text-align: center
    color: "#f8fafc"
    line-height: 1.6

stimuli:

  # ---- oddball ------------------------------------------------------------------------------------
  - name: oddball_instructions
    type: html
    style: panel
    html: |
      <h2>Oddball task</h2>
      <p>You will see a series of letters flashing one at a time at the centre of the screen.</p>
      <p>{{go.hint}} when you see the letter <b>Ǝ</b> for the <b>second</b> time. Respond as quickly as you can.</p>
    duration: null
    trigger: 19

  - { name: fixation_plus, type: text, text: "+", size: 72px, duration: 1500, trigger: 20, post: [200, 500] }

  # One entry makes oddball_A ... oddball_Ǝ, with triggers 100 ... 109.
  - name: "oddball_{value}"
    type: text
    text: "{value}"
    size: 72px
    weight: bold
    each: [A, B, C, D, E, F, H, I, L, Ǝ]
    trigger_base: 100
    duration: 200
    post: 300

  # ---- visual search --------------------------------------------------------------------------------
  - name: search_instructions
    type: html
    style: panel
    html: |
      <h2>Visual search task</h2>
      <p>You will see several letters scattered on the screen. Two of them are the target <b>E</b>; all the others are the mirror image of it, <b>Ǝ</b>.</p>
      <p>Find both targets, then {{next.hint}}. Be quick and accurate.</p>
      <p>Sometimes the targets will stand out in colour. Find both of them in the same way.</p>
    duration: null

  # Top-down search: targets (E) and distractors (the mirror image of E) have the same colour, so the targets
  # can only be found by their orientation. The letters are small (size) to make it harder.
  - name: search_array
    type: search_array          # the generator in custom/stimuli/search_array.js
    params: { targets: 2, distractors: 10, size: 16px }
    duration: null

  # Bottom-up search: the targets are a different colour, so they pop out. Same letter size as the top-down search.
  - name: search_array_popout
    type: search_array
    params: { targets: 2, distractors: 10, size: 16px, target_color: "#ff5a36" }
    duration: null
