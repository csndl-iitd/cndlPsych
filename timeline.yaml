blocks:
  - id: "participant_survey"
    module: "survey"
    config:
      form_id: "participant"

  - id: "session_survey"
    module: "survey"
    config:
      form_id: "session"

  - id: "reaction_task"
    module: "keyboard_task"
    config:
      trials:
        - name: "F_trial"
          start: "fixation_plus"
          sequence:
            - "stimulus_F"
          shuffle: false
          choices:
            - "j"
            - "f"
          correct_response: "f"
          response_stimuli:
            correct: "feedback_correct"
            incorrect: "feedback_incorrect"
          post: [400, 800]
          repetitions: 5
        - name: "J_trial"
          start: "fixation_plus"
          sequence:
            - "stimulus_J"
          shuffle: false
          choices:
            - "j"
            - "f"
          correct_response: "j"
          response_stimuli:
            correct: "feedback_correct"
            incorrect: "feedback_incorrect"
          post: [400, 800]
          repetitions: 5
      shuffle_trials: true

  - id: "stroop_task"
    module: "stroop"
    config:
      repetitions: 1
      randomize: true
      post: [200, 500]
      fixation_duration: 500
      trial_duration: 2000

  - id: "psychometric_survey"
    module: "survey"
    config:
      form_id: "psychometric"
