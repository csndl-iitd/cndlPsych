blocks:
  - id: "participant_survey"
    module: "survey"
    config:
      form_id: "participant"

  - id: "session_survey"
    module: "survey"
    config:
      form_id: "session"



  - id: "flash_task"
    module: "keyboard_task"
    config:
      trials:
        - name: "flash_instructions_trial"
          sequence:
            - "flash_instructions"
          choices: "ALL_KEYS"
          post: 1000
          repetitions: 1
        - name: "alternating_flashes"
          sequence:
            - "flash_black"
            - "flash_white"
          shuffle: false
          choices: "NO_KEYS"
          post: 0
          repetitions: 15
      shuffle_trials: false

  - id: "psychometric_survey"
    module: "survey"
    config:
      form_id: "psychometric"

