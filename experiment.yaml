# The experiment: who can take part, what is stored, and how responses work.
# Every setting is documented in docs/yaml/experiment.md.
#
# Lines starting with "#" are switched off. Every setting there is shown with its default (or an
# example): remove the "#" and change the value to use it. Settings you leave out keep their defaults.
spec_version: 1
name: Visual oddball and visual search
description: A letter oddball task and a visual search task (top-down search with some bottom-up pop-out trials).
# authors: []
# language: en
seed: auto                    # a number makes every session use the same random order
# capture_url_params: []      # URL parameters to keep in the record, e.g. [PROLIFIC_PID, STUDY_ID]

# ---- what the screen looks like ----------------------------------------------------------------
stage:
  aspect: fill                # fill, a ratio such as "16:9", or a number
  background: "#000000"
  fullscreen: preferred       # required | preferred | off
  # margin: 0
  # color: "#ffffff"
  # font: ""
  # orientation: any          # any | landscape | portrait
  # wake_lock: true           # keep the screen on

# ---- which devices can take part ---------------------------------------------------------------
device:
  select: auto                # auto | prompt | fixed
  allowed: [desktop, phone, tablet]
  # fixed: desktop            # the profile to use when select is "fixed"
  # rejected_message: ""      # shown to a device that is not allowed
  # profiles:                 # change or add what makes a device a desktop, phone, tablet or your own
  #   kiosk:
  #     when: { pointer: coarse, hover: none, keyboard: false, touch: true, min_width_px: 1000, max_width_px: 2000, orientation: landscape }
  # calibration:              # needed only if lengths are given in mm or degrees
  #   mode: none              # none | card | manual
  #   viewing_distance_mm: 600
  #   profiles: []

# ---- consent (required) --------------------------------------------------------------------------
consent:
  file: consent.md
  # text: ""                  # the consent text here instead of in a file
  # mode: on_screen           # on_screen | attested (the experimenter confirms consent was obtained)
  statements:
    - { id: read, text: "I have read the information above." }
    - { id: voluntary, text: "I understand that taking part is voluntary and I can stop at any time." }
  # min_age: 18               # stops younger participants (adds the age check to the subject form)
  # require_scroll: false     # the participant must scroll to the end of the text first
  # decline_message: ""

# ---- responses ----------------------------------------------------------------------------------
# "go" is the one response in this experiment: SPACE on a computer, a tap on a phone or tablet.
# A device with several inputs (a touch laptop) accepts all of them.
input:
  intents:
    go:
      hint: { desktop: "Press SPACE", phone: "Tap the screen", tablet: "Tap the screen" }
      desktop: { key: " " }
      phone: { tap: true }
      tablet: { tap: true }
      # doc: ""               # a note for yourself
      # plugin_key: F13        # only for custom tasks that need a particular key
  # reset: false              # true forgets all built-in settings first
  # disable: []               # built-in intents to remove
  gestures: [tap]           # tap | longpress | swipe | drag: the ones a response can use
  gesture_thresholds:
    tap: { max_duration: 500, slop: 10px }
  #   longpress: { min_duration: 500, slop: 10px }
  #   swipe: { min_distance: 40px, min_velocity: 0.2, max_duration: 1000 }
  #   drag: { slop: 10px }
  fire_on: down               # up | down: when a tap counts
  # pointer_path: false       # true, or { hz: 60 }: record where the finger or mouse went
  # hit_padding: 0
  # show_zones: false
  cursor: { autohide_ms: 1000, show_on_move_px: 3 }
  # profiles:                 # the same settings for one kind of device only; "rules" are patterns of events that produce responses (docs/yaml/input.md)
  #   tablet: { rules: [], disable: [], gestures: [tap], fire_on: up }

# Everything the participant does (every key press, touch and gesture) is recorded whether or not a
# response uses it.

# ---- triggers to external equipment (EEG, eye tracker, ...) ---------------------------------------
# Trigger codes. Universal (everything physical: key, touch, gestures, photodiode) 1-10 and semantic (the intents
# go and next reaching a response window) 11 and 12 are built in. Ours: instructions 19, oddball fixation 20,
# oddball response 21 / 22 / 23, oddball letters 100-109, search 30-34 (see timeline.yaml, stimuli.yaml). They are
# sent when a device is connected below: remove the "#" of the sink you have. Without one, nothing is sent.
triggers:
  rules:
    - { id: resp_correct, on: response.evaluated, where: { correct: true }, value: 21 }
    - { id: resp_incorrect, on: response.evaluated, where: { correct: false }, value: 22 }
    - { id: resp_timeout, on: response.timeout, value: 23 }
  sinks:
    - { id: eeg_serial, type: serial, format: raw, template: "{value:02x}", baud: 115200, reset_after_ms: 5 }
    - { id: lab_ws, type: websocket, url: "ws://localhost:8765", format: ndjson, fields: [seq, value, event, t_event, t_sent, trial, stimulus], ack: true, required: false }
  # (more sink settings:)
#     # - { id: lab, type: websocket, format: ndjson, url: "ws://localhost:8765", fields: [seq, value, event, t_event, t_sent], reconnect: { enabled: true, max_delay_ms: 5000 } }
#     # - { id: usb, type: usb, format: raw, template: "{value:02x}", vendor_id: 0, product_id: 0, endpoint: 1, configuration: 1, interface: 0 }
#     # Settings every sink has (shown with their defaults):
#     #   required: true, newline: lf, ack: false, max_queue: 256, min_gap_ms: 0, reset_after_ms: 0, reset_value: 0,
#     #   sync: { pings: 10, interval_s: 60 }
#     # More for serial: data_bits: 8, stop_bits: 1, parity: none, flow_control: none, usb_filters: [{ usb_vendor_id: 0, usb_product_id: 0 }]

# ---- eye tracking (needs the expfw-eyetracking folder: expfw init --eyetracking) -----------------
# eyetracking:
#   enabled: true
#   engine: webgazer
#   profiles: [desktop]
#   sample_hz: 30
#   calibration: { points: 9, repeats: 2 }
#   validation: { points: 5, max_error_px: 150, max_retries: 3, on_fail: retry }   # retry | continue_flagged | abort
#   revalidate: { every_trials: 50, every_minutes: 10 }
#   dwell: { radius: 50px, min_ms: 100 }
#   learn_from_clicks: false
#   camera: { preview: setup_only, on_denied: abort }   # preview: setup_only | always | never; on_denied: abort | continue_without

# ---- record video of the participant (consent text must say so; a consent statement is added for you) ---
webcam:
  enabled: true
#   profiles: [desktop, phone, tablet]   # leave out to record on every device
#   audio: false              # also record the microphone
#   video: { width: 640, height: 480, fps: 30, facing: user }   # facing: user | environment (which camera of a phone)
#   bitrate_kbps: 1000        # about 7 MB per minute
#   save: auto                # file: written straight to a file on disk that is chosen at the start (Chrome, Edge on a computer)
#                             # (the file is complete only after a normal end; a crash leaves it empty)
#                             # browser: kept in the browser, downloaded as a separate file at the end (survives a crash); auto: file where possible
#   chunk_s: 10               # how often the recorder hands over what it has (the pieces are appended to the one file)
#   on_denied: abort          # abort | continue_without: when recording cannot start (camera refused, no file chosen)
#   The video is never in the exported zip and is not uploaded to Firebase.

# ---- marks for cameras and photodiodes ------------------------------------------------------------
overlay:
  apriltags:
    enabled: true           # for locating the screen in the video of a head-mounted eye tracker (Pupil Neon)
    family: tag36h11
    ids: [0, 1, 2, 3]       # top-left, top-right, bottom-right, bottom-left
    size: 64px
    margin: 4px
    quiet_zone: 1
  photodiode:
    enabled: true
    corner: bl              # tl | tr | br | bl; beside the tag in the margin
    size: 40px
    mode: toggle            # toggle | pulse
    on: [{ on: phase.onset }]

# ---- where the data goes ----------------------------------------------------------------------------
storage:
  local: { enabled: true, recovery: offer, export_on_finish: [jsonl, csv, bids] }
  # local:                    # more settings of the same
  #   flush_ms: 2000
  #   file_access: false      # also write to a folder the experimenter chooses (Chrome, Edge)
  firebase:                 # also send the data to your Firebase project
    enabled: true
    experiment_id: visual-search
    access: controlled      # controlled: the experimenter starts sessions | public: an open link
    web_config: { apiKey: "AIzaSyA0g66lYtfkJ9bnD9P-4BQ84dMMpaRYj6k", projectId: "cndlpsych", appId: "1:188551779011:web:14a592750a5819aedfc876", authDomain: "cndlpsych.firebaseapp.com", storageBucket: "cndlpsych.firebasestorage.app", messagingSenderId: "188551779011" }
    subject_id: { width: 3, override: true, claim_timeout_min: 60 }
    chunk: { max_events: 400, max_bytes: 600000, flush_ms: 10000 }
  #   app_check: { provider: recaptcha_v3, site_key: "" }

# ---- the end ------------------------------------------------------------------------------------------
finish:
  message: "Thank you - you can close this window."
  show_session_code: true
  # redirect_url: "https://example.org/done"
  # redirect_delay: 3000

# ---- while you build the experiment -------------------------------------------------------------------
