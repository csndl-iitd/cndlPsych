$schema: http://json-schema.org/draft-07/schema#
$id: https://example.org/cndlpsych/1/experiment.schema.json
title: experiment.yaml
description: >
  Experiment-wide configuration. Content lives in forms.yaml, stimuli.yaml and
  timeline.yaml. Consent is mandatory; the subject and session forms are
  built in (see forms.yaml to extend them).

type: object
required: [spec_version, name, consent]
additionalProperties: false

properties:

  spec_version: {const: 1}
  name: {type: string, minLength: 1, maxLength: 100}
  description: {type: string}
  authors:
    type: array
    items: {type: string}
  language:
    type: string
    pattern: "^[a-z]{2}(-[A-Z]{2})?$"
    default: en
  seed:
    description: Master seed for all randomization. 'auto' draws one per session and stores it.
    anyOf:
      - {type: integer}
      - {const: auto}
    default: auto
  capture_url_params:
    description: URL query parameters copied into the session record (e.g. PROLIFIC_PID).
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}

  # ---- presentation -------------------------------------------------------
  stage:
    description: The fixed-aspect container all stimuli and hit regions are laid out in.
    type: object
    additionalProperties: false
    properties:
      aspect:
        description: Width:height of the letterboxed stage, or 'fill' to use the whole viewport.
        anyOf:
          - {type: number, exclusiveMinimum: 0}
          - {type: string, pattern: "^\\d+:\\d+$"}
          - {const: fill}
        default: fill
      margin:
        description: Extra reserved border around the stage (in addition to overlays).
        $ref: "common.schema.json#/definitions/length"
      background: {type: string, default: "#000000"}
      color: {type: string, default: "#ffffff"}
      font: {type: string}
      fullscreen: {enum: [required, preferred, off], default: preferred}
      orientation: {enum: [any, landscape, portrait], default: any}
      wake_lock: {type: boolean, default: true}

  # ---- device -------------------------------------------------------------
  device:
    type: object
    additionalProperties: false
    properties:
      select:
        description: auto = capability detection, prompt = ask the participant/experimenter, fixed = use 'fixed'.
        enum: [auto, prompt, fixed]
        default: auto
      allowed:
        description: Profiles this experiment supports; other devices are rejected with 'rejected_message'.
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "common.schema.json#/definitions/profile_id"}
      fixed: {$ref: "common.schema.json#/definitions/profile_id"}
      profiles:
        description: Override or add profile detection conditions. desktop, phone and tablet are built in.
        type: object
        propertyNames: {$ref: "common.schema.json#/definitions/profile_id"}
        additionalProperties:
          type: object
          required: [when]
          additionalProperties: false
          properties:
            when:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                pointer: {enum: [fine, coarse, none]}
                hover: {enum: [hover, none]}
                keyboard: {type: boolean}
                touch: {type: boolean}
                min_width_px: {type: number}
                max_width_px: {type: number}
                orientation: {enum: [portrait, landscape]}
      calibration:
        description: Physical-size calibration, needed only for mm / deg units.
        type: object
        additionalProperties: false
        properties:
          mode: {enum: [none, card, manual], default: none}
          viewing_distance_mm: {type: number, minimum: 50}
          profiles:
            type: array
            items: {$ref: "common.schema.json#/definitions/profile_id"}
      rejected_message: {type: string}
    allOf:
      - if: {required: [select], properties: {select: {const: fixed}}}
        then: {required: [fixed]}

  # ---- consent (mandatory) ---------------------------------------------------
  consent:
    type: object
    additionalProperties: false
    properties:
      file: {type: string, description: "markdown file in the project root"}
      text: {type: string}
      mode:
        description: on_screen = participant accepts on the device; attested = experimenter confirms consent was obtained elsewhere.
        enum: [on_screen, attested]
        default: on_screen
      statements:
        type: array
        items:
          type: object
          required: [id, text]
          additionalProperties: false
          properties:
            id: {$ref: "common.schema.json#/definitions/id"}
            text: {type: string}
            required: {type: boolean, default: true}
      min_age: {type: integer, minimum: 0, description: "eligibility gate checked against the age answer"}
      require_scroll: {type: boolean, default: false}
      decline_message: {type: string}
    oneOf:
      - required: [file]
      - required: [text]

  # ---- input and triggers (cascade roots) -----------------------------------
  input: {$ref: "input.schema.json#/definitions/scope"}
  triggers: {$ref: "triggers.schema.json#/definitions/experiment"}

  # ---- eye tracking -----------------------------------------------------------
  eyetracking:
    type: object
    required: [enabled]
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      engine: {enum: [webgazer], default: webgazer}
      profiles:
        type: array
        items: {$ref: "common.schema.json#/definitions/profile_id"}
        default: [desktop]
      sample_hz: {type: number, minimum: 1, maximum: 120, default: 30}
      calibration:
        type: object
        additionalProperties: false
        properties:
          points: {enum: [5, 9, 13], default: 9}
          repeats: {type: integer, minimum: 1, default: 2}
      validation:
        type: object
        additionalProperties: false
        properties:
          points: {type: integer, minimum: 3, default: 5}
          max_error_px: {type: number, minimum: 1, default: 150}
          max_retries: {type: integer, minimum: 0, default: 3}
          on_fail: {enum: [retry, continue_flagged, abort], default: retry}
      revalidate:
        type: object
        additionalProperties: false
        properties:
          every_trials: {type: integer, minimum: 1}
          every_minutes: {type: number, minimum: 1}
      dwell:
        description: Thresholds for the derived input.gaze.dwell event.
        type: object
        additionalProperties: false
        properties:
          radius: {$ref: "common.schema.json#/definitions/length"}
          min_ms: {type: number, minimum: 0, default: 100}
      learn_from_clicks:
        description: Let clicks silently recalibrate WebGazer mid-task. Off keeps calibration fixed.
        type: boolean
        default: false
      camera:
        type: object
        additionalProperties: false
        properties:
          preview: {enum: [setup_only, always, never], default: setup_only}
          on_denied: {enum: [abort, continue_without], default: abort}

  # ---- webcam recording --------------------------------------------------------
  webcam:
    description: >
      Record video (and optionally sound) of the participant with the device's camera, for the whole
      session. The video is written straight to one file on the computer's disk (the participant or
      experimenter chooses it at the start; Chrome and Edge on a computer), or, where the browser
      cannot do that, kept in the browser and downloaded as a separate file at the end. It is never in
      the exported zip and is not uploaded to Firebase. The consent text must say that video is
      recorded. Eye tracking, if on, uses the camera separately.
    type: object
    required: [enabled]
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      profiles:
        description: Device profiles that record; other devices take part without it. Leave it out to record on every device.
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "common.schema.json#/definitions/profile_id"}
      audio: {type: boolean, default: false, description: "also record the microphone"}
      video:
        description: What to ask the camera for; the browser gives the closest it has, and the record says what it gave.
        type: object
        additionalProperties: false
        properties:
          width: {type: integer, minimum: 160, maximum: 3840, default: 640}
          height: {type: integer, minimum: 120, maximum: 2160, default: 480}
          fps: {type: number, minimum: 1, maximum: 120, default: 30}
          facing: {enum: [user, environment], default: user, description: "which camera of a phone or tablet"}
      bitrate_kbps: {type: number, minimum: 100, maximum: 20000, default: 1000, description: "video bitrate; 1000 is about 7 MB per minute"}
      save:
        description: >
          file = write to a file on disk that is chosen at the start (needs Chrome or Edge on a computer; otherwise
          recording cannot start, see on_denied); browser = keep the video in the browser and download it as a separate
          file when the session ends; auto = file where possible, otherwise browser. With file, the video is only complete
          on disk once the session has ended normally: if the page is closed or crashes before that, the file stays empty.
          With browser, an interrupted session's video is kept and can be downloaded from the data screen (?manage=1).
        enum: [auto, file, browser]
        default: auto
      chunk_s:
        description: How often the recorder hands over what it has recorded, in seconds. The pieces are appended to the one file (or, with save browser, kept as pieces and joined at the end), so an interrupted session loses at most this much that was not yet handed over.
        type: number
        minimum: 1
        maximum: 60
        default: 10
      on_denied:
        description: What to do when recording cannot start (camera refused or missing, no file chosen). abort ends the session, continue_without goes on and says so in the record.
        enum: [abort, continue_without]
        default: abort

  # ---- overlays ---------------------------------------------------------------
  overlay:
    type: object
    additionalProperties: false
    properties:
      apriltags:
        type: object
        required: [enabled]
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          family:
            enum: [tag36h11, tag25h9, tag16h5, tagStandard41h12, tagStandard52h13, tagCircle21h7]
            default: tag36h11
          ids:
            description: Tag ids for the corners in order top-left, top-right, bottom-right, bottom-left.
            type: array
            minItems: 4
            maxItems: 4
            uniqueItems: true
            items: {type: integer, minimum: 0}
            default: [0, 1, 2, 3]
          size: {$ref: "common.schema.json#/definitions/length"}
          margin: {$ref: "common.schema.json#/definitions/length"}
          quiet_zone: {type: number, minimum: 1, default: 1, description: "white border, in tag modules"}
      photodiode:
        type: object
        required: [enabled]
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          corner:
            description: >
              Which corner's margin the patch is in. The AprilTag keeps the very corner; the patch sits beside it, never over it:
              in the side margin above or below the tag on a wide screen, in the top or bottom margin to the left or right of it on a tall one.
            enum: [tl, tr, br, bl]
            default: bl
          size: {$ref: "common.schema.json#/definitions/length"}
          mode: {enum: [toggle, pulse], default: toggle}
          pulse_ms: {type: number, minimum: 1}
          on:
            description: Events that flip/pulse the patch. Default - every phase.onset.
            type: array
            minItems: 1
            items: {$ref: "common.schema.json#/definitions/step"}

  # ---- storage --------------------------------------------------------------
  storage:
    type: object
    additionalProperties: false
    properties:
      local:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean, default: true}
          flush_ms: {type: number, minimum: 100, default: 2000}
          recovery:
            description: What to do when an unfinished session is found after a reload.
            enum: [offer, auto, off]
            default: offer
          export_on_finish:
            type: array
            uniqueItems: true
            items: {enum: [jsonl, csv, bids]}
          file_access:
            description: Also write to a chosen folder via the File System Access API where available.
            type: boolean
            default: false
      firebase:
        type: object
        required: [enabled]
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          experiment_id:
            description: Root document id in Firestore. Defaults to a slug of 'name'.
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{1,40}$"
          access:
            description: >
              controlled = experimenter-run sessions, subject ID prefilled and overridable;
              public = open link, subject ID server-assigned and locked.
            enum: [controlled, public]
          web_config:
            description: Firebase web app config (public identifiers, not secrets).
            type: object
            required: [apiKey, projectId, appId]
            additionalProperties: {type: string}
          subject_id:
            type: object
            additionalProperties: false
            properties:
              width: {type: integer, minimum: 1, maximum: 8, default: 3, description: "zero-padded digits after sub-"}
              override:
                description: "Controlled mode: the experimenter may type another number than the suggested one (a warning asks to confirm it, and a number already in use is refused); true unless set to false, which locks the field. Public mode never allows it."
                type: boolean
              claim_timeout_min: {type: number, minimum: 1, default: 60, description: "unfinished claims older than this may be released"}
          chunk:
            type: object
            additionalProperties: false
            properties:
              max_events: {type: integer, minimum: 10, maximum: 5000, default: 400}
              max_bytes: {type: integer, minimum: 10000, maximum: 900000, default: 600000, description: "Firestore documents are capped at 1 MiB"}
              flush_ms:
                description: Flush a non-empty buffer after this long. Each flush is one billed write; 10 s or more suits public studies, the local journal covers the gap.
                type: number
                minimum: 500
                default: 10000
          app_check:
            type: object
            required: [provider, site_key]
            additionalProperties: false
            properties:
              provider: {enum: [recaptcha_v3, recaptcha_enterprise]}
              site_key: {type: string}
        allOf:
          - if: {required: [enabled], properties: {enabled: {const: true}}}
            then: {required: [access, web_config]}
          - if: {required: [access], properties: {access: {const: public}}}
            then:
              properties:
                subject_id:
                  properties:
                    override: {const: false}

  # ---- end of session ---------------------------------------------------------
  finish:
    type: object
    additionalProperties: false
    properties:
      message: {type: string, description: "markdown shown at the end"}
      redirect_url: {type: string, pattern: "^https?://"}
      redirect_delay: {$ref: "common.schema.json#/definitions/duration_scalar"}
      show_session_code: {type: boolean, default: false}

  debug:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean, default: false}
      log_level: {enum: [error, warn, info, debug], default: warn}
      show_events: {type: boolean, default: false}
      simulate_profile: {$ref: "common.schema.json#/definitions/profile_id"}
      time_scale:
        description: Multiply all durations (e.g. 0.2 for fast dry runs). Never stored as valid data.
        type: number
        exclusiveMinimum: 0
