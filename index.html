<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychophysics Experiment Platform</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- jsPsych Styles -->
    <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app-background"></div>
    
    <div id="settings-panel" class="glass-panel">
        <h1>Experiment Configuration</h1>
        
        <div class="form-section">
            <h2>1. Firebase Configuration</h2>
            <div class="input-group">
                <label>API Key</label>
                <input type="text" id="fb-apikey" placeholder="AIzaSy...">
            </div>
            <div class="input-group">
                <label>Auth Domain</label>
                <input type="text" id="fb-authdomain" placeholder="project-id.firebaseapp.com">
            </div>
            <div class="input-group">
                <label>Project ID</label>
                <input type="text" id="fb-projectid" placeholder="project-id">
            </div>
            <button id="save-fb-btn" class="btn secondary">Save Config</button>
            <span id="fb-status" class="status-badge disconnected">Unconfigured</span>
        </div>

        <div class="form-section">
            <h2>2. Trigger Mechanism</h2>
            <div class="radio-group">
                <label><input type="radio" name="trigger-mode" value="none" checked> None</label>
                <label><input type="radio" name="trigger-mode" value="webserial"> WebSerial (PC)</label>
                <label><input type="radio" name="trigger-mode" value="webusb"> WebUSB (Android)</label>
                <label><input type="radio" name="trigger-mode" value="websocket"> WebSocket</label>
            </div>
            <div id="websocket-config" class="hidden">
                <div class="input-group">
                    <label>WebSocket URL</label>
                    <input type="text" id="ws-url" placeholder="ws://localhost:8080">
                </div>
            </div>
            <button id="connect-trigger-btn" class="btn secondary">Connect Device</button>
            <span id="trigger-status" class="status-badge disconnected">Disconnected</span>
            
            <div id="trigger-test-section" class="input-group hidden" style="margin-top: 1.5rem;">
                <label>Test Marker Connection</label>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
                    <input type="text" id="trigger-test-input" placeholder="Marker Byte (e.g. 1)" value="1" style="flex: 1;">
                    <button id="trigger-test-btn" class="btn secondary">Send Test Marker</button>
                </div>
                <span id="trigger-test-status" style="font-size: 0.85rem; margin-top: 0.5rem; display: block;"></span>
            </div>
        </div>

        <div class="form-section">
            <h2>3. Media Recording</h2>
            <div class="checkbox-group">
                <label><input type="checkbox" id="record-webcam"> Record Webcam</label>
                <label><input type="checkbox" id="record-screen"> Record Screen</label>
            </div>
            <button id="test-media-btn" class="btn secondary">Request Permissions</button>
            <span id="media-status" class="status-badge disconnected">Not Ready</span>
        </div>

        <div class="actions" style="display: flex; gap: 0.5rem; flex-direction: column;">
            <button id="start-experiment-btn" class="btn primary">Start Experiment</button>
            <button id="settings-back-btn" class="btn secondary hidden" style="width: 100%;">Back to Dashboard</button>
        </div>
    </div>

    <div id="dashboard-panel" class="glass-panel hidden">
        <h1>Experiment Dashboard</h1>
        
        <div class="form-section">
            <h2>Active Configuration</h2>
            <div class="summary-details">
                <div class="summary-row">
                    <span class="label">Firebase Project:</span>
                    <span id="summary-firebase-project" class="value">Not Configured</span>
                </div>
                <div class="summary-row">
                    <span class="label">Trigger Mode:</span>
                    <span id="summary-trigger-mode" class="value">None</span>
                </div>
                <div class="summary-row">
                    <span class="label">Media Recording:</span>
                    <span id="summary-media-options" class="value">None</span>
                </div>
            </div>
        </div>

        <div id="dashboard-trigger-test" class="form-section hidden">
            <h2>Trigger Device Status</h2>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                <span id="dashboard-trigger-status" class="status-badge disconnected">Disconnected</span>
                <button id="dashboard-connect-btn" class="btn secondary">Connect Device</button>
            </div>
            <div id="dashboard-test-controls" class="input-group hidden">
                <label>Test Marker Connection</label>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
                    <input type="text" id="dashboard-test-input" placeholder="Marker Byte (e.g. 1)" value="1" style="flex: 1;">
                    <button id="dashboard-test-btn" class="btn secondary">Send Test Marker</button>
                </div>
                <span id="dashboard-test-status" style="font-size: 0.85rem; margin-top: 0.5rem; display: block;"></span>
            </div>
        </div>

        <div class="actions" style="display: flex; gap: 1rem; flex-direction: column;">
            <button id="dashboard-start-btn" class="btn primary">Start Experiment</button>
            <button id="edit-settings-btn" class="btn secondary" style="width: 100%;">Edit Settings</button>
        </div>
    </div>



    <!-- jsPsych container -->
    <div id="jspsych-container" class="hidden"></div>

    <!-- jsPsych Library (latest v8) -->
    <script src="https://unpkg.com/jspsych@8.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.0.0"></script>

    <!-- Main Module -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
